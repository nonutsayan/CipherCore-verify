server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: ciphercore-backend
  datasource:
    url: jdbc:h2:file:./data/ciphercore_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# Application specific configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: ./uploads
  demo-mode: true
  rules:
    active-version: 2026.1-APH
  ai-provider:
    mode: DETERMINISTIC_FALLBACK
    confidence-threshold: 0.85
  google:
    vision:
      enabled: true
      api-key: ${GOOGLE_VISION_API_KEY:}
      endpoint: https://vision.googleapis.com/v1
      max-pages-per-doc: 10
      timeout-seconds: 30
    gemini:
      enabled: true
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      endpoint: https://generativelanguage.googleapis.com/v1beta
      timeout-seconds: 45
      temperature: 0.1
    oauth:
      enabled: true
      client-id: ${GOOGLE_CLIENT_ID:}
      officer-emails:
        - arvind.kumar.aicte@gmail.com
        - a.kumar@aicte-india.org
        - reviewer@aicte-india.org
    drive:
      enabled: false
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
